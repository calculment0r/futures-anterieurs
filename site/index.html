  [data-rv]{transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1);}
  [data-rv].pre{opacity:0;transform:translateY(24px);}

  @media(prefers-reduced-motion:reduce){[data-rv].pre,[data-mask].pre{opacity:1;transform:none;clip-path:none;}*{animation:none !important;}}

  @media(max-width:820px){

    header nav{gap:14px !important;}
    #porte{padding:74px 20px 26px !important;}
    #manifeste{padding:70px 20px 76px !important;}
    /* la colonne latérale d'une dalle — sommaire d'une carte, axes d'un outil —
       tombait au-dessus du titre une fois la dalle dépliée en colonne unique.
       Elle sort : le titre, la logline et le bouton suffisent à décider. */
    [data-flanc]{display:none !important;}
    /* les trois outils tiennent sur une ligne, ou l'en-tête se plie en trois */
    [data-outils]{gap:11px !important;font-size:9.5px !important;letter-spacing:.08em !important;}
    [data-outils] a{white-space:nowrap;}
  }
  @media(max-width:430px){

<section id="manifeste" data-screen-label="Manifeste" style="position:relative;background:#f7f5ef;border-top:1px solid #d0ccbb;padding:110px 32px 120px;">

    <div data-rv="1" style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a92;">Ce qu'il y a ici</div>

    <div style="display:flex;flex-direction:column;gap:26px;font-size:clamp(19px,2vw,26px);line-height:1.45;letter-spacing:-.015em;text-wrap:pretty;">
      <p data-rv="1" data-d="0">Quatre textes, écrits entre avril et juillet 2026. Le premier suit une philosophie de blog obscure jusqu'aux couloirs du pouvoir américain, et montre que l'infrastructure est déjà posée. Le deuxième, en deux cent vingt et un fragments, dit comment nous avons cessé de la voir. Le troisième ne décrit plus : il oriente, et cherche la sortie. Le quatrième est un transcript — une nuit de travail avec une machine, sa chaîne de pensée comprise, non réécrite.</p>
      <p data-rv="1" data-d="1">Ils ne forment pas une thèse. Ils forment une position.</p>
      <p data-rv="1" data-d="2">Deux instruments les tiennent ensemble, et ne sont pas des ornements. <span style="color:#3d6600;">La propagation</span> calcule ce que les quatre textes ont en commun sans qu'on le leur ait dit : on épingle une des dix catégories du premier, et le corpus s'allume dans son sillage — quels fragments elle éclaire, quelle unité du carnet elle atteint, où elle ressort dans la nuit. <span style="color:#7d2b7a;">Les auteurs</span> posent sur un même plan les soixante noms convoqués ; un lien n'y existe que si deux d'entre eux sont assez proches. On en prend un, on le promène, et le voisinage se refait autour de lui.</p>
      <p data-rv="1" data-d="3" style="color:#4a4a55;">Ce site n'en est pas la vitrine. Il en est la cinquième carte — la première mise en pratique de ce que les quatre affirment. Aucun résumé. Aucun assistant. Aucune mesure d'audience. Les textes ne sont pas recopiés dans les pages : ils sont lus à l'affichage depuis leurs fichiers source, et le corpus se télécharge.</p>
    </div>

    <blockquote data-rv="1" data-d="4" style="border-top:1px solid #d0ccbb;padding-top:30px;display:flex;flex-direction:column;gap:14px;">
      <p style="font-size:clamp(17px,1.8vw,22px);line-height:1.5;color:#1a1a1f;max-width:880px;text-wrap:pretty;">une pratique souveraine doit être constituée selon les principes qu'elle défend. on ne construit pas l'autonomie cognitive avec des outils qui produisent la dépendance.</p>
      <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;color:#4a7a00;">2:§102</span>

  </div>
</section>

      const n1 = (md1.match(/^## \d+ — /gm) || []).length;
      const ch = M.parse2(md2);
      const nf = ch.reduce((a, c) => a + c.frags.length, 0);
      const p3 = M.parse3(md3);
      const nb = p3.filter((p) => p.kind === "bif").length;
      const extras = [];
      if (p3.some((p) => p.kind === "seuil")) extras.push("un seuil");
      if (p3.some((p) => p.kind === "lettre")) extras.push("une lettre");
      const t4 = M.parse4(md4).turns;
      this.setState({
        m1: n1 + " sections",
        m2: ch.length + " portes · " + nf + " fragments",
        m3: nb + " bifurcations" + (extras.length ? " · " + extras.join(", ") : ""),
        m4: t4.length + " tours · " + (t4.length ? t4[0].id.replace("4:", "") + " → " + t4[t4.length - 1].id.replace("4:", "") : "")
      });
    } catch (e) { /* les valeurs de départ restent affichées */ }
  }

  componentDidMount() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.readCorpus();

    // les six dalles épinglées : les quatre cartes, puis les deux instruments
    this.slabs = ['Carte 01', 'Carte 02', 'Carte 03', 'Carte 04', 'Outil 01', 'Outil 02']
      .map((l) => document.querySelector('[data-screen-label="' + l + '"]'));
    this.foot = document.querySelector("footer");

    // révélations : on pose l'état caché seulement si l'observer est disponible
    const rv = Array.from(document.querySelectorAll("[data-rv],[data-mask]"));
    if (!reduce && window.IntersectionObserver) {
      rv.forEach((n) => n.classList.add("pre"));
      this.io = new IntersectionObserver((es) => {
        es.forEach((e) => {
          if (!e.isIntersecting) return;
          const d = parseInt(e.target.getAttribute("data-d") || "0", 10);
          if (d) e.target.style.transitionDelay = d * 95 + "ms";
          e.target.classList.remove("pre");
          this.io.unobserve(e.target);
        });
      }, { rootMargin: "0px 0px -12% 0px", threshold: 0.05 });
      rv.forEach((n) => this.io.observe(n));
      // le filet coupe la transition AVANT de retirer .pre : une transition a besoin
      // que la timeline avance, et c'est justement ce qui peut manquer.
      this.net = setTimeout(() => rv.forEach((n) => {
        if (!n.classList.contains("pre")) return;
        n.style.transition = "none";
        n.classList.remove("pre");
        requestAnimationFrame(() => { n.style.transition = ""; });
      }), 1500);
    }

    // une dalle ne s'épingle que si son contenu tient dans le cadre : la rangée de trois
    // colonnes se replie à une largeur dérivée du contenu, donc on mesure au lieu de fixer un seuil.
    this.fitSlabs = () => {
      const vh = window.innerHeight;
      this.slabs.forEach((n) => {
        if (!n) return;
        const row = n.firstElementChild;
        const need = (row ? row.getBoundingClientRect().height : 0) + 136;
        const tall = need > vh - 2;
        n.style.position = tall ? "static" : "sticky";
        n.style.minHeight = tall ? "0px" : "100svh";
      });
    };
    this.fitSlabs();
    this.fitTimer = setTimeout(this.fitSlabs, 320);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.fitSlabs);

    this.hero = document.querySelector("[data-hero]");
    const posY = () => window.scrollY || document.documentElement.scrollTop || 0;
    const maxY = () => Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    this.lastY = -1;
    const update = (y) => {
      if (y === this.lastY) return;
      this.lastY = y;
      if (this.hero && !reduce) {
        const p = Math.min(1, y / window.innerHeight);
        this.hero.style.transform = "translateY(" + (p * 90).toFixed(1) + "px)";
        this.hero.style.opacity = String(Math.max(0, 1 - p * 1.35));
      }
      let active = 0;
      this.slabs.forEach((n, i) => {
        if (!n) return;
        const r = n.getBoundingClientRect();
        if (r.top <= 60 && r.bottom > 60) active = i + 1;
      });
      let dark = active === 4;
      if (this.foot) { const r = this.foot.getBoundingClientRect(); if (r.top <= 30 && r.bottom > 30) dark = true; }
      if (dark !== this.state.dark || active !== this.state.active) this.setState({ dark: dark, active: active });
    };

    this.target = posY();
    this.gliding = false;
    this.rafAlive = false;
    const frame = () => {
      this.rafAlive = true;
      let y = posY();
      if (this.gliding) {
        const d = this.target - y;
        if (Math.abs(d) < 0.6) { window.scrollTo(0, this.target); this.gliding = false; }
        else { window.scrollTo(0, y + d * 0.11); }
        y = posY();
      } else { this.target = y; }
      update(y);
      this.rafId = requestAnimationFrame(frame);
    };
    this.rafId = requestAnimationFrame(frame);
    this.onScroll = () => { if (!this.gliding) this.target = posY(); update(posY()); };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onResize = () => { this.fitSlabs(); this.lastY = -1; update(posY()); };
    window.addEventListener("resize", this.onResize);
    update(posY());

    const smooth = !reduce && this.props.scrollLisse !== false && !matchMedia("(pointer: coarse)").matches;
    if (!smooth) return;
    this.onWheel = (e) => {
      if (e.ctrlKey || !this.rafAlive) return;
      e.preventDefault();
      const base = this.gliding ? this.target : posY();
      this.target = Math.min(maxY(), Math.max(0, base + e.deltaY * (e.deltaMode === 1 ? 18 : 1)));
      this.gliding = true;
    };
    window.addEventListener("wheel", this.onWheel, { passive: false });
  }

  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this.net); clearTimeout(this.fitTimer);
    if (this.rafId) cancelAnimationFrame(this.rafId);
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("resize", this.onResize);
    if (this.onWheel) window.removeEventListener("wheel", this.onWheel);
  }

  renderVals() {
    const a = this.state.active;
    return {
      m1: this.state.m1, m2: this.state.m2, m3: this.state.m3, m4: this.state.m4,
      railDim: this.state.dark ? "#3a3a46" : "#c9c4b0",
      // la bande de l'en-tête prend la couleur de la dalle qu'elle couvre
      bandeau: this.state.dark
        ? "background:#17171c;border-bottom:1px solid #2a2a33;color:#e8e8f0;"
        : "background:#f7f5ef;border-bottom:1px solid rgba(208,204,187,.5);color:#1a1a1f;",
      at1: a === 1, off1: a !== 1,
      at2: a === 2, off2: a !== 2,
      at3: a === 3, off3: a !== 3,
      at4: a === 4, off4: a !== 4,
      at5: a === 5, off5: a !== 5,
      at6: a === 6, off6: a !== 6
    };
  }
}
DC.mount(Component, { scrollLisse: true });
</script>
</body>
</html>

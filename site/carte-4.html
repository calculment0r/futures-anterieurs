<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f5ef'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<title>4 — Archibald is back · Futures Antérieurs</title>
<meta name="description" content="Transcript, 21–22 juillet 2026. La voix d'en face — la nuit à l'entrée de la passe." />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{overflow-x:hidden;scroll-behavior:smooth;}
  body{background:#f7f5ef;color:#1a1a1f;font-family:'Host Grotesk',system-ui,sans-serif;font-size:18px;line-height:1.62;}
  a{color:inherit;text-decoration:none;}
  a:hover{color:#a8560a;}
  ::selection{background:#1a1a1f;color:#f7f5ef;}
  @keyframes riseIn{from{transform:translateY(105%) rotate(2deg);}to{transform:translateY(0) rotate(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
  @media(max-width:820px){
    body{font-size:16.5px;}
    [data-read]{padding-left:20px !important;padding-right:20px !important;}
    [data-bar]{padding-left:20px !important;padding-right:20px !important;}
    [data-hero]{padding-left:20px !important;padding-right:20px !important;}
    [data-bub]{margin-left:0 !important;margin-right:0 !important;}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>
<body>
<noscript><p style="font-family:'DM Mono',monospace;font-size:13px;line-height:1.8;padding:40px 30px;">Cette page lit le corpus à l'affichage — les textes ne sont pas recopiés dans le HTML, ils sont lus depuis <code>corpus/</code>. Il lui faut JavaScript. Les sources brutes restent lisibles telles quelles dans le dépôt.</p></noscript>

<!-- Le gabarit de l'écran, tel que composé dans Claude Design. dc-lite.js le
     compile et le monte : rien n'est rendu deux fois, rien ne clignote. -->
<template id="dc-template">
<div style="position:fixed;inset:0;z-index:9000;pointer-events:none;mix-blend-mode:multiply;opacity:.45;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%224%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22 opacity=%220.3%22/></svg>');"></div>

<header style="position:fixed;top:0;left:0;right:0;z-index:8000;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 30px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#f7f5ef;mix-blend-mode:difference;">
  <a href="index.html" style="color:#f7f5ef;display:flex;align-items:center;gap:10px;"><span>←</span><span>La Porte</span></a>
  <div style="display:flex;gap:16px;align-items:center;">
    <span style="opacity:.5;">Carte 04</span>
    <span>{{ curAddr }}</span>
  </div>
</header>

<section data-hero="1" data-screen-label="Ouverture" style="position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(78px,10vh,110px) 30px 34px;">
  <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a92;display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .9s .1s forwards;">
    <span style="color:#a8560a;">Carte 04</span><span>—</span><span>Transcript</span><span>—</span><span>21–22 juillet 2026</span><span>—</span><span style="color:#c4283a;">brouillon V0</span>
  </div>
  <div style="max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:30px;">
    <h1 style="font-weight:700;letter-spacing:-.045em;line-height:.86;text-transform:uppercase;font-size:min(clamp(30px,8vw,124px),15vh);">
      <span style="display:block;overflow:hidden;padding-bottom:.03em;"><span style="display:block;animation:riseIn 1.1s .16s cubic-bezier(.16,1,.3,1) forwards;">Archibald</span></span>
      <span style="display:block;overflow:hidden;padding-bottom:.03em;"><span style="display:block;animation:riseIn 1.1s .28s cubic-bezier(.16,1,.3,1) forwards;color:#a8560a;">is back</span></span>
    </h1>
    <p style="font-size:clamp(19px,2.2vw,30px);line-height:1.3;letter-spacing:-.02em;max-width:900px;text-wrap:pretty;animation:fadeUp .9s .5s forwards;">La voix d'en face — la nuit à l'entrée de la passe.</p>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:11px;color:#4a4a55;animation:fadeUp .9s .65s forwards;">
      <span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;border-radius:3px;background:#eef2fb;border:1px solid #c9d8f2;"></span>Cal — messages corrigés, voix intacte</span>
      <span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;border-radius:3px;background:#f2f4ea;border:1px solid #d7dcc4;"></span>Arche — réponses telles quelles</span>
      <span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;border-radius:3px;background:#f0efe8;border:1px solid #cfcabb;"></span>le gris — chaîne de pensée brute</span>
    </div>
  </div>
  <div style="max-width:1100px;width:100%;margin:0 auto;display:flex;align-items:center;gap:11px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a92;animation:fadeUp .9s .8s forwards;">
    <span>Le seuil</span><span style="display:inline-block;animation:bob 2.2s ease-in-out infinite;">↓</span>
  </div>
</section>

<section id="seuil" data-sec="4:seuil" data-screen-label="Le seuil" style="scroll-margin-top:120px;border-top:1px solid #d0ccbb;background:#efece2;padding:92px 30px 100px;">
  <div style="max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px;">
    <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#a8560a;">4:seuil</div>
    <p style="font-weight:700;text-transform:uppercase;letter-spacing:-.035em;line-height:1;font-size:clamp(25px,4vw,54px);">Ce qui suit est un transcript.<br />Rien n'a été réécrit.</p>
    <div style="display:flex;flex-direction:column;gap:16px;max-width:660px;">
      <sc-for list="{{ seuilParas }}" as="p" hint-placeholder-count="1">
        <p style="color:#4a4a55;text-wrap:pretty;">{{ p }}</p>
      </sc-for>
    </div>
    <div style="border:1px dashed #b8b39c;border-radius:8px;padding:14px 17px;font-family:'DM Mono',monospace;font-size:11.5px;line-height:1.8;color:#8a8a92;">
      L'intro d'Archibald n'est pas écrite — l'emplacement lui est réservé ici. Le titre est provisoire, et la coda 4:H44–H45 reste à valider.
    </div>
  </div>
</section>

<div data-stick="1" style="position:sticky;top:50px;z-index:7000;background:rgba(247,245,239,.92);backdrop-filter:blur(10px);border-top:1px solid #d0ccbb;border-bottom:1px solid #d0ccbb;">
  <div data-bar="1" style="max-width:920px;margin:0 auto;padding:10px 30px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:10.5px;">
    <span style="letter-spacing:.18em;text-transform:uppercase;color:#8a8a92;">Le fil</span>
    <span style="color:#a8560a;">{{ curAddr }}</span>
    <span style="flex:1;min-width:10px;"></span>
    <button onClick="{{ toggleGris }}" style="border:1px solid #b8b39c;border-radius:20px;padding:6px 12px;background:none;color:#4a4a55;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:border-color .25s ease,color .25s ease;" style-hover="border-color:#7a7a86;color:#1a1a1f;">{{ grisLabel }}</button>
    <button onClick="{{ toggleAll }}" style="border:1px solid #b8b39c;border-radius:20px;padding:6px 12px;background:none;color:#4a4a55;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:border-color .25s ease,color .25s ease;" style-hover="border-color:#7a7a86;color:#1a1a1f;">{{ allLabel }}</button>
  </div>
</div>

<div data-read="1" style="max-width:920px;margin:0 auto;padding:30px 30px 110px;">
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <p style="font-family:'DM Mono',monospace;font-size:13px;color:#8a8a92;padding:54px 0;">Lecture de <span style="color:#1a1a1f;">corpus/4_ARCHIBALD.md</span> — le texte n'est pas recopié, il est lu.</p>
  </sc-if>
  <sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}">
    <p style="font-family:'DM Mono',monospace;font-size:13px;line-height:1.8;color:#c4283a;padding:54px 0;">Le fichier source n'a pas pu être lu : {{ err }}<br /><span style="color:#4a4a55;">Le site doit être servi (pas ouvert en file://) pour lire le corpus.</span></p>
  </sc-if>

  <sc-for list="{{ turns }}" as="t" hint-placeholder-count="4">
    <div id="{{ t.anchor }}" data-sec="{{ t.id }}" style="scroll-margin-top:130px;margin:26px 0;display:flex;flex-direction:column;gap:7px;">
      <div style="display:flex;gap:10px;align-items:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:{{ t.tint }};">
        <span style="border:1px solid {{ t.bd }};border-radius:3px;padding:1px 6px;">{{ t.id }}</span>
        <span>{{ t.who }}</span>
        <span style="color:#8a8a92;opacity:.8;">{{ t.time }}</span>
        <sc-if value="{{ t.isIncipit }}" hint-placeholder-val="{{ false }}">
          <span style="color:#c4283a;border:1px solid #c4283a;border-radius:3px;padding:1px 6px;">incipit</span>
        </sc-if>
      </div>

      <div data-bub="1" style="{{ t.bub }}">
        <sc-for list="{{ t.notes }}" as="n" hint-placeholder-count="0">
          <div style="display:inline-flex;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;color:#4a4a55;background:#ece9df;border:1px solid #b8b39c;border-radius:20px;padding:3px 10px;margin-bottom:10px;">{{ n }}</div>
        </sc-for>

        <sc-if value="{{ t.showGris }}" hint-placeholder-val="{{ false }}">
          <div style="margin:2px 0 14px;border:1px solid #cfcabb;border-left:3px solid #7a7a86;border-radius:8px;background:#f0efe8;">
            <button onClick="{{ t.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7a7a86;padding:10px 14px;background:none;border:none;cursor:pointer;text-align:left;">
              <span>gris — chaîne de pensée, brute</span><span>{{ t.caret }}</span>
            </button>
            <sc-if value="{{ t.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding:0 15px 14px;display:flex;flex-direction:column;gap:10px;color:#5f5f6b;font-size:15px;line-height:1.62;">
                <sc-for list="{{ t.gris }}" as="g" hint-placeholder-count="1">
                  <p style="text-wrap:pretty;">{{ g }}</p>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-for list="{{ t.collages }}" as="cg" hint-placeholder-count="0">
          <div style="margin:4px 0 12px;border:1px dashed #b8b39c;border-radius:8px;background:#e2decf;">
            <button onClick="{{ cg.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8a92;padding:10px 14px;background:none;border:none;cursor:pointer;text-align:left;">
              <span>{{ cg.label }}</span><span>{{ cg.caret }}</span>
            </button>
            <sc-if value="{{ cg.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding:0 15px 14px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;font-family:'DM Mono',monospace;font-size:13px;line-height:1.62;color:#4a4a55;">
                <sc-for list="{{ cg.paras }}" as="cp" hint-placeholder-count="1">
                  <p style="white-space:pre-wrap;">{{ cp }}</p>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <sc-for list="{{ t.paras }}" as="p" hint-placeholder-count="1">
            <p style="text-wrap:pretty;">{{ p }}</p>
          </sc-for>
        </div>

        <sc-if value="{{ t.hasTools }}" hint-placeholder-val="{{ false }}">
          <div style="font-family:'DM Mono',monospace;font-size:10.5px;color:#8a8a92;margin-top:11px;padding-top:9px;border-top:1px dotted #b8b39c;">{{ t.tools }}</div>
        </sc-if>
      </div>
    </div>
  </sc-for>

  <section id="colophon" style="scroll-margin-top:120px;padding:52px 0 0;border-top:1px solid #d0ccbb;display:flex;flex-direction:column;gap:20px;">
    <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a92;">Colophon</div>
    <p style="font-family:'DM Mono',monospace;font-size:13px;line-height:1.85;color:#4a4a55;">CAL &amp; ARCHE — 21–22 JUILLET 2026 · Incipit fixé à 4:H32, « Tu l'avais. »<br />Source lue à l'affichage : <span style="color:#1a1a1f;">corpus/4_ARCHIBALD.md</span>. Les messages de Cal sont corrigés de leurs fautes de frappe, sa voix intacte ; la chaîne de pensée est brute, en anglais.</p>
    <p style="font-family:'DM Mono',monospace;font-size:13px;line-height:1.85;color:#a8560a;">Le fleuve coule. Les berges changent. L'essai persiste.</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px;">
      <a href="index.html" style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:14px 24px;border-radius:40px;border:1px solid #b8b39c;color:#4a4a55;display:inline-flex;align-items:center;gap:12px;transition:background .35s ease,color .35s ease,border-color .35s ease,gap .35s ease;" style-hover="background:#a8560a;color:#f7f5ef;border-color:#a8560a;gap:20px;"><span>←</span> Retour à la Porte</a>
      <a href="propagation.html" style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:14px 24px;border-radius:40px;border:1px solid #b8b39c;color:#4a4a55;display:inline-flex;align-items:center;gap:12px;transition:gap .35s ease,color .35s ease,border-color .35s ease;" style-hover="gap:20px;color:#1a1a1f;border-color:#1a1a1f;">La propagation <span>→</span></a>
    </div>
  </section>
</div>

<footer style="background:#17171c;color:#9a9ab0;padding:58px 30px 40px;font-family:'DM Mono',monospace;font-size:11.5px;line-height:1.9;letter-spacing:.04em;">
  <div style="max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:space-between;align-items:flex-end;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <span style="color:#e8e8f0;text-transform:uppercase;letter-spacing:.2em;">Carte 04 — Archibald is back</span>
      <span>Adresses 4:HNN et 4:ANN · la couche grise en 4:ANN.gris.</span>
    </div>
    <span style="color:#b8a98f;">Statut : brouillon V0.</span>
  </div>
</footer>
</template>

<script src="assets/dc-lite.js"></script>
<script type="module">
class Component extends DCLogic {
  state = { seuil: [], turns: [], loading: true, err: "", grisOn: true, open: {}, addr: "4:seuil" };

  componentDidMount() {
    (async () => {
      try {
        const M = await import("./corpus.js");
        const md = await M.load("./corpus/4_ARCHIBALD.md");
        const d = M.parse4(md);
        this.setState({ seuil: d.seuil, turns: d.turns, loading: false });
        this.settle();
      } catch (e) {
        this.setState({ loading: false, err: (e && e.message) ? e.message : String(e) });
      }
    })();

    const chromeH = () => {
      const hd = document.querySelector("header"), bar = document.querySelector("[data-stick]");
      return (hd ? hd.getBoundingClientRect().height : 50) + (bar ? bar.getBoundingClientRect().height : 42) + 17;
    };
    this.sync = () => {
      const m = Math.round(chromeH()) + "px";
      document.querySelectorAll("[data-sec],#colophon").forEach((n) => { n.style.scrollMarginTop = m; });
    };
    const land = () => {
      const h = decodeURIComponent((location.hash || "").slice(1));
      if (!h) return;
      const el = document.getElementById(h);
      if (!el) return;
      this.sync();
      const de = document.documentElement, prev = de.style.scrollBehavior;
      de.style.scrollBehavior = "auto";
      window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + (window.scrollY || de.scrollTop || 0) - chromeH()));
      de.style.scrollBehavior = prev;
    };
    this.land = land;
    this.settle = () => {
      this.sync(); land();
      requestAnimationFrame(() => { this.sync(); land(); });
      setTimeout(() => { this.sync(); land(); }, 260);
      setTimeout(() => { this.sync(); land(); }, 900);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { this.sync(); land(); });
    };
    window.addEventListener("hashchange", land);
    window.addEventListener("resize", this.onRz = this.sync);

    this.lastY = -1;
    const update = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      if (y === this.lastY) return;
      this.lastY = y;
      let addr = this.state.addr;
      document.querySelectorAll("[data-sec]").forEach((n) => {
        const r = n.getBoundingClientRect();
        if (r.top <= 160 && r.bottom > 160) addr = n.getAttribute("data-sec");
      });
      if (addr !== this.state.addr) this.setState({ addr: addr });
    };
    const frame = () => { update(); this.raf = requestAnimationFrame(frame); };
    this.raf = requestAnimationFrame(frame);
    window.addEventListener("scroll", this.onSc = update, { passive: true });
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("hashchange", this.land);
    window.removeEventListener("resize", this.onRz);
    window.removeEventListener("scroll", this.onSc);
  }

  tog(k) { this.setState((s) => ({ open: Object.assign({}, s.open, { [k]: !s.open[k] }) })); }

  renderVals() {
    const CAL = "background:#eef2fb;border:1px solid #c9d8f2;border-radius:10px;padding:15px 19px;margin-left:38px;";
    const ARC = "background:#f2f4ea;border:1px solid #d7dcc4;border-radius:10px;padding:15px 19px;margin-right:38px;";
    const anyOpen = Object.keys(this.state.open).some((k) => this.state.open[k]);

    const turns = this.state.turns.map((t) => ({
      id: t.id,
      anchor: t.id.replace(":", "-"),
      who: t.who === "cal" ? "Cal" : "Arche",
      time: t.time,
      tint: t.who === "cal" ? "#1f5fc4" : "#4a7a00",
      bd: t.who === "cal" ? "#c9d8f2" : "#d7dcc4",
      bub: t.who === "cal" ? CAL : ARC,
      isIncipit: t.id === "4:H32",
      notes: t.notes,
      paras: t.paras,
      gris: t.gris,
      showGris: this.state.grisOn && t.gris.length > 0,
      open: !!this.state.open[t.id],
      caret: this.state.open[t.id] ? "replier ▴" : "déplier ▾",
      toggle: () => this.tog(t.id),
      collages: t.collages.map((cg, i) => ({
        label: cg.label,
        paras: cg.paras,
        open: !!this.state.open[t.id + ":c" + i],
        caret: this.state.open[t.id + ":c" + i] ? "replier ▴" : "déplier ▾",
        toggle: () => this.tog(t.id + ":c" + i)
      })),
      hasTools: !!t.tools,
      tools: t.tools
    }));

    return {
      loading: this.state.loading,
      failed: !!this.state.err,
      err: this.state.err,
      curAddr: this.state.addr,
      seuilParas: this.state.seuil,
      turns: turns,
      grisLabel: this.state.grisOn ? "Masquer le gris" : "Afficher le gris",
      toggleGris: () => this.setState({ grisOn: !this.state.grisOn }),
      allLabel: anyOpen ? "Tout replier" : "Tout déplier",
      toggleAll: () => {
        if (anyOpen) { this.setState({ open: {} }); return; }
        const o = {};
        this.state.turns.forEach((t) => {
          if (t.gris.length) o[t.id] = true;
          t.collages.forEach((cg, i) => { o[t.id + ":c" + i] = true; });
        });
        this.setState({ open: o });
      }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
